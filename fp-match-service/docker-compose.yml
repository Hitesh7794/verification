# docker-compose for local fingerprint-matching dev on macOS or Linux dev boxes.
#
# Usage:
#   1. (No .env needed — SourceAFIS has no licence.)
#   2. From this directory:  ./dev-up.sh    (or:  docker compose up --build)
#   3. Mac-native backend reaches the service on http://localhost:8050.
#
# Pure-Java image — runs natively on Apple Silicon (arm64) AND Linux (amd64).
# No platform pinning, no emulation overhead.

services:
  fp-match-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: fp-match-service:1.0.0
    container_name: fp-match-service
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 on the host so the service is only reachable
      # from the host machine — never the local network. Backend on the
      # host hits http://localhost:8050 (its default FP_MATCH_BASE).
      - "127.0.0.1:8050:8050"
    environment:
      FP_MATCH_PORT: 8050
      FP_MATCH_BIND: 0.0.0.0
      # Override the default threshold from .env if you need to calibrate.
      FP_MATCH_THRESHOLD: ${FP_MATCH_THRESHOLD:-40}
    healthcheck:
      # /fp/health returns ErrorCode "0" + Version when the service is up.
      # No external dependencies to validate (unlike luxand which waits on
      # JNI + license activation) so this comes ready in ~2 seconds.
      test: ["CMD", "curl", "-fs", "-X", "POST", "http://127.0.0.1:8050/fp/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
