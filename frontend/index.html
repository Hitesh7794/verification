<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification Portal</title>
    <!-- Plus Jakarta Sans (display) + Inter (UI) + JetBrains Mono (identifiers).
         Preconnect reduces TTFB for the font files; display=swap prevents FOIT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <!-- MediaPipe FaceLandmarker + blink guide. Self-hosted so the
         liveness step keeps working when CDN routes (jsdelivr /
         googleapis) are slow or blocked on the operator's network.
         Exposes window.seqrFaceGuide.{preload, start, stop}. -->
    <script defer src="/face_guide.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
